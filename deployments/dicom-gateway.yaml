apiVersion: apps/v1
kind: Deployment
metadata: {name: dicom-gateway}
spec:
  replicas: 2
  selector: {matchLabels: {app: dicom-gateway}}
  template:
    metadata: {labels: {app: dicom-gateway}}
    spec:
      containers:
      - name: gateway
        image: dicom-gateway:dev
        ports: [{containerPort: 8080}]
        readinessProbe: {httpGet: {path: /readyz, port: 8080}}
        livenessProbe: {httpGet: {path: /healthz, port: 8080}}
